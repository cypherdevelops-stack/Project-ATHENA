<!doctype html>
<html lang="en">
  <body>
    <h1>Choose a new password</h1>
    {% if validlink %}
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Set password</button>
      </form>
    {% else %}
      <p>This password reset link is invalid or has expired.</p>
    {% endif %}
  </body>
</html>
